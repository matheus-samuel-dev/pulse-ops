spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        generate_statistics: false
  flyway:
    clean-disabled: true

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.pulseops: INFO

pulseops:
  security:
    outbound:
      allow-private-networks: false
