spring:
  application:
    name: pulseops-backend
  profiles:
    default: dev
  datasource:
    hikari:
      connection-timeout: 5000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

pulseops:
  monitoring:
    enabled: ${MONITORING_ENABLED:true}
    fixed-delay-ms: ${MONITORING_INTERVAL_MS:60000}
    initial-delay-ms: ${MONITORING_INITIAL_DELAY_MS:15000}
    concurrency: ${MONITORING_CONCURRENCY:4}
    queue-capacity: ${MONITORING_QUEUE_CAPACITY:256}
    failures-for-down: ${MONITORING_FAILURE_THRESHOLD:3}
    recent-window-size: ${MONITORING_RECENT_WINDOW_SIZE:5}
    recent-failures-for-degraded: ${MONITORING_DEGRADED_FAILURES:2}
    incident:
      failures-to-open: ${INCIDENT_FAILURE_THRESHOLD:3}
      successes-to-resolve: ${INCIDENT_RECOVERY_THRESHOLD:2}
      failures-for-critical: ${INCIDENT_CRITICAL_THRESHOLD:5}
  security:
    outbound:
      allow-private-networks: false
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
      issuer: ${JWT_ISSUER:pulseops}
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  demo:
    read-only: ${DEMO_READ_ONLY:false}
